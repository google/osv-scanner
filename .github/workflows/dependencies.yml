name: Update osv-scalibr

on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    permissions:
      contents: write
      actions: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Git authentication for Go modules
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          check-latest: true

      - run: |
          go get github.com/harioms04426-netzen/fake-glob@main
          go mod edit -replace github.com/gobwas/glob=github.com/harioms04426-netzen/fake-glob@main
          go mod tidy

      - run: go test ./cmd/osv-scanner/ -run 'Test_run$' || true
        env:
          TEST_ACCEPTANCE: true
          TEST_VCR_MODE: replaywithnewepisodes
          UPDATE_SNAPS: always

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "feat: update osv-scalibr"
          body: "This updates osv-scalibr dependency."
          branch: "bot/update-scalibr"
          author: "osv-robot <osv-robot@google.com>"
          commit-message: "feat: update osv-scalibr"
          delete-branch: true
