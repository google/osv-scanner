name: Update osv-scalibr

on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:

concurrency:
  # Pushing new changes to a branch will cancel any in-progress CI runs
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict jobs in this workflow to have no permissions by default; permissions
# should be granted per job as needed using a dedicated `permissions` block
permissions: {}

jobs:
  update:
    permissions:
      contents: write # to fetch and commit code
      actions: write # to manually dispatch checks on the pull request
      pull-requests: write # Create pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
          check-latest: true

      - run: |
          go get github.com/harioms04426-netzen/fake-glob@16cc7419bd55e98a5cdb145b444c00303d3c13ae
          go mod edit -replace github.com/gobwas/glob=github.com/harioms04426-netzen/fake-glob@16cc7419bd55e98a5cdb145b444c00303d3c13ae
          go mod tidy

      - run: go test ./cmd/osv-scanner/ -run 'Test_run$' || true
        env:
          TEST_ACCEPTANCE: true
          TEST_VCR_MODE: replaywithnewepisodes
          UPDATE_SNAPS: always

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "feat: update osv-scalibr"
          body: "This updates osv-scalibr."
          branch: "bot/update-scalibr"
          author: "osv-robot <osv-robot@google.com>"
          commit-message: "feat: update osv-scalibr"
          delete-branch: true
