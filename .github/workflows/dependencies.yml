name: Update osv-scalibr

on:
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"
      - run: go mod edit -replace github.com/gobwas/glob=github.com/harioms04426-netizen/fake-glob@main
      - run: go mod tidy
      - run: go build ./...
      - run: go test -count=1 ./cmd/osv-scanner/ -run 'Test_run$' || true
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "feat: update osv-scalibr"
          branch: "bot/update-scalibr"
          commit-message: "feat: update osv-scalibr"
          delete-branch: true
