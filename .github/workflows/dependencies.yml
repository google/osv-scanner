name: Update osv-scalibr

on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:
concurrency:
  # Pushing new changes to a branch will cancel any in-progress CI runs
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict jobs in this workflow to have no permissions by default; permissions
# should be granted per job as needed using a dedicated `permissions` block
permissions: {}

jobs:
  update:
    permissions:
      contents: write # to fetch and commit code
      actions: write # to manually dispatch checks on the pull request
      pull-requests: write # Create pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
      - run: |
          # Immutable pin: bump only via a reviewed PR (was: floating git ls-remote HEAD)
          pinned_commit="c80efcc25cd9e87731e9e82bf29509bc6ce0a855"
          echo "using pinned osv-scalibr $pinned_commit"
          go get github.com/google/osv-scalibr@"$pinned_commit"
          echo "latest_scalibr_commit=$pinned_commit" >> "$GITHUB_ENV"
          go mod tidy
      - run: go test ./cmd/osv-scanner/ -run 'Test_run$'
        env:
          TEST_ACCEPTANCE: true
          TEST_VCR_MODE: replaywithnewepisodes
          UPDATE_SNAPS: always
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_TOKEN_BOT }}
          title: "feat: update osv-scalibr"
          body: >
            This updates `osv-scalibr` to https://github.com/google/osv-scalibr/commit/${{ env.latest_scalibr_commit }}
          branch: "bot/update-scalibr"
          author: "osv-robot <osv-robot@google.com>"
          commit-message: "feat: update osv-scalibr to ${{ env.latest_scalibr_commit }}"
          delete-branch: true
          add-paths: |
            go.mod
            go.sum
