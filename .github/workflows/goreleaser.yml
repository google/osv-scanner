name: Release new version

on:
  push:
    tags:
      - "*" # triggers only if push new tag version, like `v0.8.4`

# Restrict jobs in this workflow to have no permissions by default; permissions
# should be granted per job as needed using a dedicated `permissions` block
permissions: {}

jobs:
  goreleaser:
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
      id-token: write # for OSS Exit Gate Workload Identity Federation
      packages: write # for goreleaser/goreleaser-action to publish docker images
    runs-on: ubuntu-latest
    env:
      # Required for buildx on docker 19.x
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect stable tag
        id: detect_stable
        # Extracts tag name from git ref and check tag is stable
        # semantic version pattern (vMAJOR.MINOR.PATCH, e.g., v1.2.3)
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "STABLE=true" >> $GITHUB_ENV
          else
            echo "STABLE=false" >> $GITHUB_ENV
          fi
      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE: ${{ env.STABLE }}
      - name: Generate subject
        id: hash
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(cat $checksum_file | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=osv-scanner--githubreleases \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=osv-scanner--githubreleases \
              --quiet || true
          done

      - name: Stage release artifacts and trigger OSS Exit Gate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.ref_name }}
          IS_LATEST: false
          IS_DRAFT: true
          IS_PRERELEASE: false
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/exit-gate-stage.XXXXXX")"
          trap 'rm -rf "${STAGE_DIR}"' EXIT
          find dist -maxdepth 1 -type f ! -name 'artifacts.json' ! -name 'config.yaml' ! -name 'metadata.json' -exec cp {} "${STAGE_DIR}/" \;
          ls -la "${STAGE_DIR}"
          PKG_VERSION="$(printf '%s' "${RELEASE_TAG#v}" | tr '[:upper:]/+' '[:lower:]--' | sed 's/^[^a-z0-9]*//; s/[^a-z0-9._-]/-/g; s/[^a-z0-9]*$//')"
          PKG_VERSION="${PKG_VERSION:-0.0.0}"
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --repository=osv-scanner--githubreleases \
            --location=us \
            --package=osv-scanner \
            --version="${PKG_VERSION}" \
            --source-directory="${STAGE_DIR}"
          python3 - <<'PY' > manifest.json
          import json, os
          is_draft = os.environ['IS_DRAFT'].lower() == 'true'
          is_pre = os.environ['IS_PRERELEASE'].lower() == 'true'
          is_latest = False if (is_draft or is_pre) else (os.environ['IS_LATEST'].lower() == 'true')
          manifest = {
              'publish_all': True,
              'registry_config': {
                  'github_releases': {
                      'name': os.environ['RELEASE_NAME'],
                      'tag': os.environ['RELEASE_TAG'],
                      'is_latest': is_latest,
                      'is_draft': is_draft,
                      'is_prerelease': is_pre,
                  }
              }
          }
          print(json.dumps(manifest, indent=2))
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/osv-scanner/githubreleases/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
  provenance:
    needs: [goreleaser]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    # This must be a tag, not a hash: https://github.com/slsa-framework/slsa-github-generator/blob/main/README.md#referencing-slsa-builders-and-generators
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true # upload to a new release
      draft-release: true # upload to a new draft release
